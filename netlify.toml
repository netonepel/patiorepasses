[build]
  publish = "public"
  functions = "netlify/functions"
  # Economia de créditos: se o commit só mexeu em arquivos que não vão para o site
  # (ex.: LEIA-ME.md), o Netlify pula a publicação. Publicação pulada não gasta crédito.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- public netlify netlify.toml package.json package-lock.json"

[functions]
  node_bundler = "esbuild"
